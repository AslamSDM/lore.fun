name: Modify README for Vercel Trigger
on:
  push:
    branches: [ main ]  # Change to your default branch if different

jobs:
  modify-readme:
    runs-on: ubuntu-latest
    # Only run for non-owner commits
    if: github.actor != github.repository_owner
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git history

      - name: Add whitespace to README
        run: |
          # Add a space to README.md
          echo " " >> README.md
          
          # Configure git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Commit the change
          git add README.md
          git commit -m "Add whitespace to trigger Vercel deployment [skip ci]"
          git push

      - name: Print completion message
        run: echo "Whitespace added to README.md to trigger Vercel deployment"
